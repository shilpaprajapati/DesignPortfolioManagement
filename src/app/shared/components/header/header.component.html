<header class="fixed top-0 left-0 right-0 z-50 bg-sand/90 dark:bg-charcoal/90 backdrop-blur-md transition-colors">
  <nav class="container mx-auto px-6 py-4">
    <div class="flex items-center justify-between">
      <!-- Logo/Name -->
      <a routerLink="/" class="text-2xl font-display font-semibold text-charcoal dark:text-sand hover:text-primary transition-colors">
        {{ contentService.siteConfig()?.designerName || 'Portfolio' }}
      </a>

      <!-- Navigation -->
      <div class="hidden md:flex items-center gap-8">
        <a routerLink="/" routerLinkActive="text-primary" [routerLinkActiveOptions]="{exact: true}" 
           class="text-charcoal dark:text-sand hover:text-primary transition-colors">
          Work
        </a>
        <a routerLink="/about" routerLinkActive="text-primary"
           class="text-charcoal dark:text-sand hover:text-primary transition-colors">
          About
        </a>
        <a routerLink="/contact" routerLinkActive="text-primary"
           class="text-charcoal dark:text-sand hover:text-primary transition-colors">
          Contact
        </a>
        <button (click)="toggleDarkMode()" 
                class="p-2 rounded-full hover:bg-charcoal/10 dark:hover:bg-sand/10 transition-colors"
                aria-label="Toggle dark mode">
          <svg *ngIf="!themeService.darkMode()" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                  d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
          </svg>
          <svg *ngIf="themeService.darkMode()" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                  d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
          </svg>
        </button>
      </div>

      <!-- Mobile Menu Button -->
      <button class="md:hidden p-2" aria-label="Menu">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
    </div>
  </nav>
</header>
