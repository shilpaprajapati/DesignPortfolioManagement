<!-- Hero Section -->
<section class="min-h-screen flex items-center justify-center bg-gradient-to-br from-sand via-sand to-clay/20 dark:from-charcoal dark:via-charcoal dark:to-charcoal/90">
  <div class="container mx-auto px-6 text-center">
    <h1 class="text-6xl md:text-8xl font-display font-bold text-charcoal dark:text-sand mb-6 animate-fade-in">
      {{ contentService.siteConfig()?.designerName }}
    </h1>
    <p class="text-2xl md:text-3xl text-charcoal/80 dark:text-sand/80 mb-8 animate-fade-in-delay">
      {{ contentService.siteConfig()?.tagline }}
    </p>
    <a href="#portfolio" 
       class="inline-block px-8 py-4 bg-primary text-white rounded-full hover:bg-primary/90 transition-all hover:scale-105 shadow-lg">
      View Work
    </a>
  </div>
</section>

<!-- Portfolio Section -->
<section id="portfolio" class="py-20 bg-sand dark:bg-charcoal transition-colors">
  <div class="container mx-auto px-6">
    <!-- Filters -->
    <div class="mb-12">
      <h2 class="text-4xl font-display font-bold text-charcoal dark:text-sand mb-8">Portfolio</h2>
      
      <!-- Category Filter -->
      <div class="mb-6">
        <h3 class="text-sm font-semibold text-charcoal/60 dark:text-sand/60 mb-3 uppercase tracking-wide">Categories</h3>
        <div class="flex flex-wrap gap-3">
          <button (click)="setCategory('all')" 
                  [class.bg-primary]="selectedCategory() === 'all'"
                  [class.text-white]="selectedCategory() === 'all'"
                  class="px-4 py-2 rounded-full bg-white dark:bg-charcoal border border-charcoal/20 dark:border-sand/20 hover:border-primary transition-all">
            All
          </button>
          <button *ngFor="let category of contentService.categories()" 
                  (click)="setCategory(category.id)"
                  [class.bg-primary]="selectedCategory() === category.id"
                  [class.text-white]="selectedCategory() === category.id"
                  class="px-4 py-2 rounded-full bg-white dark:bg-charcoal border border-charcoal/20 dark:border-sand/20 hover:border-primary transition-all">
            {{ category.title }}
          </button>
        </div>
      </div>

      <!-- Tool Filter -->
      <div class="mb-6">
        <h3 class="text-sm font-semibold text-charcoal/60 dark:text-sand/60 mb-3 uppercase tracking-wide">Tools</h3>
        <div class="flex flex-wrap gap-3">
          <button (click)="setTool('all')" 
                  [class.bg-primary]="selectedTool() === 'all'"
                  [class.text-white]="selectedTool() === 'all'"
                  class="px-4 py-2 rounded-full bg-white dark:bg-charcoal border border-charcoal/20 dark:border-sand/20 hover:border-primary transition-all">
            All Tools
          </button>
          <button *ngFor="let tool of contentService.getAllTools()" 
                  (click)="setTool(tool)"
                  [class.bg-primary]="selectedTool() === tool"
                  [class.text-white]="selectedTool() === tool"
                  class="px-4 py-2 rounded-full bg-white dark:bg-charcoal border border-charcoal/20 dark:border-sand/20 hover:border-primary transition-all">
            {{ tool }}
          </button>
        </div>
      </div>
    </div>

    <!-- Portfolio Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <article *ngFor="let item of filteredItems" 
               class="group cursor-pointer"
               [routerLink]="['/project', item.id]">
        <div class="relative overflow-hidden rounded-lg bg-white dark:bg-charcoal/50 shadow-lg hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2">
          <!-- Thumbnail -->
          <div class="aspect-w-16 aspect-h-12 overflow-hidden bg-gray-200">
            <div class="w-full h-64 bg-gradient-to-br from-clay/20 to-sage/20 flex items-center justify-center">
              <span class="text-charcoal/40 text-sm">{{ item.title }}</span>
            </div>
          </div>
          
          <!-- Content -->
          <div class="p-6">
            <div class="flex items-center gap-2 mb-2">
              <span *ngIf="item.featured" 
                    class="px-2 py-1 text-xs bg-primary/10 text-primary rounded-full">
                Featured
              </span>
              <span class="text-xs text-charcoal/60 dark:text-sand/60">{{ item.year }}</span>
            </div>
            
            <h3 class="text-xl font-display font-semibold text-charcoal dark:text-sand mb-2 group-hover:text-primary transition-colors">
              {{ item.title }}
            </h3>
            
            <p class="text-charcoal/70 dark:text-sand/70 text-sm mb-4 line-clamp-2">
              {{ item.description }}
            </p>
            
            <!-- Tools -->
            <div class="flex flex-wrap gap-2">
              <span *ngFor="let tool of item.tools" 
                    class="text-xs px-2 py-1 bg-charcoal/5 dark:bg-sand/5 rounded">
                {{ tool }}
              </span>
            </div>
          </div>
        </div>
      </article>
    </div>

    <!-- Empty State -->
    <div *ngIf="filteredItems.length === 0" class="text-center py-20">
      <p class="text-xl text-charcoal/60 dark:text-sand/60">No projects found matching your filters.</p>
    </div>
  </div>
</section>
