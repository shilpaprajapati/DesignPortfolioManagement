<div *ngIf="project" class="min-h-screen bg-sand dark:bg-charcoal transition-colors pt-24 pb-20">
  <div class="container mx-auto px-6">
    <!-- Back Button -->
    <button routerLink="/" 
            class="flex items-center gap-2 text-charcoal dark:text-sand hover:text-primary transition-colors mb-8">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
      Back to Portfolio
    </button>

    <!-- Project Header -->
    <div class="mb-12">
      <div class="flex items-center gap-4 mb-4">
        <span *ngIf="project.featured" 
              class="px-3 py-1 text-sm bg-primary/10 text-primary rounded-full">
          Featured
        </span>
        <span class="text-charcoal/60 dark:text-sand/60">{{ project.year }}</span>
      </div>
      
      <h1 class="text-5xl md:text-6xl font-display font-bold text-charcoal dark:text-sand mb-6">
        {{ project.title }}
      </h1>
      
      <p class="text-xl text-charcoal/80 dark:text-sand/80 max-w-3xl">
        {{ project.description }}
      </p>
    </div>

    <!-- Project Info Grid -->
    <div class="grid md:grid-cols-3 gap-8 mb-12">
      <!-- Tools -->
      <div>
        <h3 class="text-sm font-semibold text-charcoal/60 dark:text-sand/60 mb-3 uppercase tracking-wide">Tools Used</h3>
        <div class="flex flex-wrap gap-2">
          <span *ngFor="let tool of project.tools" 
                class="px-3 py-1 bg-white dark:bg-charcoal/50 border border-charcoal/20 dark:border-sand/20 rounded-full text-sm">
            {{ tool }}
          </span>
        </div>
      </div>

      <!-- Tags -->
      <div>
        <h3 class="text-sm font-semibold text-charcoal/60 dark:text-sand/60 mb-3 uppercase tracking-wide">Tags</h3>
        <div class="flex flex-wrap gap-2">
          <span *ngFor="let tag of project.tags" 
                class="px-3 py-1 bg-white dark:bg-charcoal/50 border border-charcoal/20 dark:border-sand/20 rounded-full text-sm">
            #{{ tag }}
          </span>
        </div>
      </div>

      <!-- Links -->
      <div>
        <h3 class="text-sm font-semibold text-charcoal/60 dark:text-sand/60 mb-3 uppercase tracking-wide">Links</h3>
        <div class="flex flex-col gap-2">
          <a *ngIf="project.figmaLink" 
             [href]="project.figmaLink" 
             target="_blank"
             class="text-primary hover:underline flex items-center gap-2">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 12a4 4 0 110-8 4 4 0 010 8zm0 8a4 4 0 110-8 4 4 0 010 8z"/>
            </svg>
            View in Figma
          </a>
          <button (click)="copyLink()" 
                  class="text-primary hover:underline flex items-center gap-2 text-left">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                    d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
            </svg>
            Copy Share Link
          </button>
        </div>
      </div>
    </div>

    <!-- Image Gallery -->
    <div class="space-y-8">
      <div *ngFor="let image of project.images" 
           class="rounded-lg overflow-hidden shadow-xl bg-white dark:bg-charcoal/50">
        <div class="aspect-video bg-gradient-to-br from-clay/20 to-sage/20 flex items-center justify-center">
          <span class="text-charcoal/40 dark:text-sand/40">{{ project.title }}</span>
        </div>
      </div>
    </div>

    <!-- Video Player -->
    <div *ngIf="project.videoUrl" class="mt-8">
      <div class="aspect-video rounded-lg overflow-hidden shadow-xl bg-charcoal/10">
        <iframe [src]="project.videoUrl" 
                class="w-full h-full"
                frameborder="0" 
                allow="autoplay; fullscreen; picture-in-picture" 
                allowfullscreen>
        </iframe>
      </div>
    </div>

    <!-- Adobe Files Download -->
    <div *ngIf="project.adobeLinks && (project.adobeLinks.ai || project.adobeLinks.psd || project.adobeLinks.ae || project.adobeLinks.xd)" 
         class="mt-12 p-8 bg-white dark:bg-charcoal/50 rounded-lg">
      <h3 class="text-xl font-display font-semibold text-charcoal dark:text-sand mb-4">Download Files</h3>
      <div class="flex flex-wrap gap-4">
        <a *ngIf="project.adobeLinks.ai" 
           [href]="project.adobeLinks.ai"
           class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary/90 transition-all">
          Download .AI
        </a>
        <a *ngIf="project.adobeLinks.psd" 
           [href]="project.adobeLinks.psd"
           class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary/90 transition-all">
          Download .PSD
        </a>
        <a *ngIf="project.adobeLinks.ae" 
           [href]="project.adobeLinks.ae"
           class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary/90 transition-all">
          Download .AEP
        </a>
        <a *ngIf="project.adobeLinks.xd" 
           [href]="project.adobeLinks.xd"
           class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary/90 transition-all">
          Download .XD
        </a>
      </div>
    </div>
  </div>
</div>
