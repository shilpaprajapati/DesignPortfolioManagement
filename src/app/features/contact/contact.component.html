<div class="min-h-screen bg-sand dark:bg-charcoal transition-colors pt-24 pb-20">
  <div class="container mx-auto px-6 max-w-4xl">
    <!-- Header -->
    <h1 class="text-5xl md:text-6xl font-display font-bold text-charcoal dark:text-sand mb-8">
      Let's Work Together
    </h1>
    <p class="text-xl text-charcoal/80 dark:text-sand/80 mb-12">
      Have a project in mind? I'd love to hear about it.
    </p>

    <div class="grid md:grid-cols-2 gap-12">
      <!-- Contact Form -->
      <div>
        <form (ngSubmit)="onSubmit()" #contactForm="ngForm" class="space-y-6">
          <div>
            <label for="name" class="block text-sm font-semibold text-charcoal dark:text-sand mb-2">
              Name *
            </label>
            <input 
              type="text" 
              id="name" 
              name="name"
              [(ngModel)]="formData.name"
              required
              class="w-full px-4 py-3 bg-white dark:bg-charcoal/50 border border-charcoal/20 dark:border-sand/20 rounded-lg focus:border-primary focus:outline-none transition-colors text-charcoal dark:text-sand">
          </div>

          <div>
            <label for="email" class="block text-sm font-semibold text-charcoal dark:text-sand mb-2">
              Email *
            </label>
            <input 
              type="email" 
              id="email" 
              name="email"
              [(ngModel)]="formData.email"
              required
              class="w-full px-4 py-3 bg-white dark:bg-charcoal/50 border border-charcoal/20 dark:border-sand/20 rounded-lg focus:border-primary focus:outline-none transition-colors text-charcoal dark:text-sand">
          </div>

          <div>
            <label for="message" class="block text-sm font-semibold text-charcoal dark:text-sand mb-2">
              Message *
            </label>
            <textarea 
              id="message" 
              name="message"
              [(ngModel)]="formData.message"
              required
              rows="6"
              class="w-full px-4 py-3 bg-white dark:bg-charcoal/50 border border-charcoal/20 dark:border-sand/20 rounded-lg focus:border-primary focus:outline-none transition-colors text-charcoal dark:text-sand resize-none">
            </textarea>
          </div>

          <button 
            type="submit"
            [disabled]="!contactForm.valid || submitted"
            class="w-full px-8 py-4 bg-primary text-white rounded-lg hover:bg-primary/90 transition-all disabled:opacity-50 disabled:cursor-not-allowed shadow-lg hover:shadow-xl">
            <span *ngIf="!submitted">Send Message</span>
            <span *ngIf="submitted" class="flex items-center justify-center gap-2">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
              </svg>
              Message Sent!
            </span>
          </button>
        </form>
      </div>

      <!-- Contact Info -->
      <div>
        <div class="space-y-8">
          <div>
            <h3 class="text-sm font-semibold text-charcoal/60 dark:text-sand/60 mb-3 uppercase tracking-wide">
              Email
            </h3>
            <a [href]="'mailto:' + contentService.siteConfig()?.email" 
               class="text-xl text-charcoal dark:text-sand hover:text-primary transition-colors">
              {{ contentService.siteConfig()?.email }}
            </a>
          </div>

          <div>
            <h3 class="text-sm font-semibold text-charcoal/60 dark:text-sand/60 mb-3 uppercase tracking-wide">
              Phone
            </h3>
            <p class="text-xl text-charcoal dark:text-sand">
              {{ contentService.siteConfig()?.phone }}
            </p>
          </div>

          <div>
            <h3 class="text-sm font-semibold text-charcoal/60 dark:text-sand/60 mb-3 uppercase tracking-wide">
              Location
            </h3>
            <p class="text-xl text-charcoal dark:text-sand">
              {{ contentService.siteConfig()?.location }}
            </p>
          </div>

          <div>
            <h3 class="text-sm font-semibold text-charcoal/60 dark:text-sand/60 mb-3 uppercase tracking-wide">
              Follow Me
            </h3>
            <div class="flex gap-4">
              <a *ngIf="contentService.siteConfig()?.social?.behance" 
                 [href]="contentService.siteConfig()!.social.behance!" 
                 target="_blank"
                 class="w-12 h-12 flex items-center justify-center bg-white dark:bg-charcoal/50 border border-charcoal/20 dark:border-sand/20 rounded-lg hover:border-primary transition-all">
                <span class="sr-only">Behance</span>
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M6.5 4.5h11v1.5h-11z"/>
                </svg>
              </a>
              <a *ngIf="contentService.siteConfig()?.social?.dribbble" 
                 [href]="contentService.siteConfig()!.social.dribbble!" 
                 target="_blank"
                 class="w-12 h-12 flex items-center justify-center bg-white dark:bg-charcoal/50 border border-charcoal/20 dark:border-sand/20 rounded-lg hover:border-primary transition-all">
                <span class="sr-only">Dribbble</span>
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
                </svg>
              </a>
              <a *ngIf="contentService.siteConfig()?.social?.instagram" 
                 [href]="contentService.siteConfig()!.social.instagram!" 
                 target="_blank"
                 class="w-12 h-12 flex items-center justify-center bg-white dark:bg-charcoal/50 border border-charcoal/20 dark:border-sand/20 rounded-lg hover:border-primary transition-all">
                <span class="sr-only">Instagram</span>
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M12 2c2.717 0 3.056.01 4.122.06 1.065.05 1.79.217 2.428.465.66.254 1.216.598 1.772 1.153a4.908 4.908 0 0 1 1.153 1.772c.247.637.415 1.363.465 2.428.047 1.066.06 1.405.06 4.122 0 2.717-.01 3.056-.06 4.122-.05 1.065-.218 1.79-.465 2.428a4.883 4.883 0 0 1-1.153 1.772 4.915 4.915 0 0 1-1.772 1.153c-.637.247-1.363.415-2.428.465-1.066.047-1.405.06-4.122.06-2.717 0-3.056-.01-4.122-.06-1.065-.05-1.79-.218-2.428-.465a4.89 4.89 0 0 1-1.772-1.153 4.904 4.904 0 0 1-1.153-1.772c-.248-.637-.415-1.363-.465-2.428C2.013 15.056 2 14.717 2 12c0-2.717.01-3.056.06-4.122.05-1.066.217-1.79.465-2.428a4.88 4.88 0 0 1 1.153-1.772A4.897 4.897 0 0 1 5.45 2.525c.638-.248 1.362-.415 2.428-.465C8.944 2.013 9.283 2 12 2z"/>
                </svg>
              </a>
              <a *ngIf="contentService.siteConfig()?.social?.linkedin" 
                 [href]="contentService.siteConfig()!.social.linkedin!" 
                 target="_blank"
                 class="w-12 h-12 flex items-center justify-center bg-white dark:bg-charcoal/50 border border-charcoal/20 dark:border-sand/20 rounded-lg hover:border-primary transition-all">
                <span class="sr-only">LinkedIn</span>
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.79M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/>
                </svg>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
