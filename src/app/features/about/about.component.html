<div class="min-h-screen bg-sand dark:bg-charcoal transition-colors pt-24 pb-20">
  <div class="container mx-auto px-6 max-w-4xl">
    <!-- Header -->
    <h1 class="text-5xl md:text-6xl font-display font-bold text-charcoal dark:text-sand mb-8">
      About Me
    </h1>

    <!-- Bio -->
    <div class="prose prose-lg dark:prose-invert mb-12">
      <p class="text-xl text-charcoal/80 dark:text-sand/80 leading-relaxed">
        {{ contentService.siteConfig()?.bio }}
      </p>
    </div>

    <!-- Skills -->
    <div class="mb-12">
      <h2 class="text-3xl font-display font-semibold text-charcoal dark:text-sand mb-6">
        Skills & Tools
      </h2>
      <div class="flex flex-wrap gap-3">
        <span *ngFor="let skill of contentService.skills()" 
              class="px-4 py-2 bg-white dark:bg-charcoal/50 border border-charcoal/20 dark:border-sand/20 rounded-full">
          {{ skill }}
        </span>
      </div>
    </div>

    <!-- Contact Info -->
    <div class="mb-12">
      <h2 class="text-3xl font-display font-semibold text-charcoal dark:text-sand mb-6">
        Get in Touch
      </h2>
      <div class="space-y-4">
        <div class="flex items-center gap-3">
          <svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                  d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
          <a [href]="'mailto:' + contentService.siteConfig()?.email" 
             class="text-charcoal dark:text-sand hover:text-primary transition-colors">
            {{ contentService.siteConfig()?.email }}
          </a>
        </div>
        <div class="flex items-center gap-3">
          <svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                  d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
          </svg>
          <span class="text-charcoal dark:text-sand">
            {{ contentService.siteConfig()?.phone }}
          </span>
        </div>
        <div class="flex items-center gap-3">
          <svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                  d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                  d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
          <span class="text-charcoal dark:text-sand">
            {{ contentService.siteConfig()?.location }}
          </span>
        </div>
      </div>
    </div>

    <!-- Social Links -->
    <div class="mb-12">
      <h2 class="text-3xl font-display font-semibold text-charcoal dark:text-sand mb-6">
        Connect
      </h2>
      <div class="flex flex-wrap gap-4">
        <a *ngIf="contentService.siteConfig()?.social?.behance" 
           [href]="contentService.siteConfig()!.social.behance!" 
           target="_blank"
           class="px-6 py-3 bg-white dark:bg-charcoal/50 border border-charcoal/20 dark:border-sand/20 rounded-lg hover:border-primary transition-all">
          Behance
        </a>
        <a *ngIf="contentService.siteConfig()?.social?.dribbble" 
           [href]="contentService.siteConfig()!.social.dribbble!" 
           target="_blank"
           class="px-6 py-3 bg-white dark:bg-charcoal/50 border border-charcoal/20 dark:border-sand/20 rounded-lg hover:border-primary transition-all">
          Dribbble
        </a>
        <a *ngIf="contentService.siteConfig()?.social?.instagram" 
           [href]="contentService.siteConfig()!.social.instagram!" 
           target="_blank"
           class="px-6 py-3 bg-white dark:bg-charcoal/50 border border-charcoal/20 dark:border-sand/20 rounded-lg hover:border-primary transition-all">
          Instagram
        </a>
        <a *ngIf="contentService.siteConfig()?.social?.linkedin" 
           [href]="contentService.siteConfig()!.social.linkedin!" 
           target="_blank"
           class="px-6 py-3 bg-white dark:bg-charcoal/50 border border-charcoal/20 dark:border-sand/20 rounded-lg hover:border-primary transition-all">
          LinkedIn
        </a>
        <a *ngIf="contentService.siteConfig()?.social?.twitter" 
           [href]="contentService.siteConfig()!.social.twitter!" 
           target="_blank"
           class="px-6 py-3 bg-white dark:bg-charcoal/50 border border-charcoal/20 dark:border-sand/20 rounded-lg hover:border-primary transition-all">
          Twitter
        </a>
      </div>
    </div>

    <!-- Resume Download -->
    <div>
      <a [href]="contentService.siteConfig()?.resumeUrl" 
         download
         class="inline-flex items-center gap-2 px-8 py-4 bg-primary text-white rounded-lg hover:bg-primary/90 transition-all shadow-lg hover:shadow-xl">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
        Download Resume
      </a>
    </div>
  </div>
</div>
